<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Della's BIAB Nails</title>
  <meta name="description" content="BIAB, acrylic and gel nails. See prices and working days, and book your appointment online.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="index">
  <div id="announcement" class="announcement" hidden>
    <p class="script" id="announcement-title"></p>
    <p id="announcement-text"></p>
  </div>

  <header class="site-header hero">
    <a class="brand-link" href="/">
      <span class="brand" data-info="businessName">Della's</span>
      <span class="brand-sub" data-info="businessSubtitle">BIAB Nails</span>
    </a>
    <span class="sparkle s1">✦</span><span class="sparkle s2">✦</span><span class="sparkle s3">✦</span>
    <div class="divider"><span>♥</span></div>
    <p class="tagline" data-info="tagline"></p>
    <div class="cta-row">
      <a class="btn" href="/book">Book an appointment</a>
      <a class="btn outline" href="/prices">See prices</a>
    </div>
  </header>

  <nav class="nav" aria-label="Main">
    <a href="/" aria-current="page">Home</a>
    <a href="/prices">Prices</a>
    <a href="/book">Book</a>
    <a href="/contact">Contact</a>
  </nav>

  <main>
    <section class="card intro">
      <h2 class="section-title">Welcome</h2>
      <p class="about" data-info="about"></p>
      <div class="quick-links">
        <a href="/prices" class="quick-link"><span class="script">Prices</span><span>BIAB, acrylics, toes &amp; extras</span></a>
        <a href="/book" class="quick-link"><span class="script">Book</span><span>Pick your treatments and a time</span></a>
        <a href="/contact" class="quick-link"><span class="script">Contact</span><span>WhatsApp or Facebook</span></a>
      </div>
    </section>
    <section class="card">
      <h2 class="section-title">Working Days</h2>
      <ul class="hours-list" data-hours></ul>
    </section>
  </main>

  <footer class="footer">
    <div class="divider small"><span>♥</span></div>
    <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
  </footer>

  <script src="site.js"></script>
</body>
</html>
