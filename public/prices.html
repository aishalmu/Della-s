<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <nav class="nav" aria-label="Main">

      <h1 class="section-title">Price List</h1>
      <div id="price-list" class="price-list"><p class="muted">Loading prices…</p></div>

  <footer class="footer">
