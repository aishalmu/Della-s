<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Della's BIAB Nails</title>
  <meta name="description" content="Get in touch with Della's BIAB Nails on WhatsApp or Facebook.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
  <div id="announcement" class="announcement" hidden>
    <p class="script" id="announcement-title"></p>
    <p id="announcement-text"></p>
  </div>

  <header class="site-header">
    <a class="brand-link" href="/">
      <span class="brand" data-info="businessName">Della's</span>
      <span class="brand-sub" data-info="businessSubtitle">BIAB Nails</span>
    </a>
  </header>

  <nav class="nav" aria-label="Main">
    <a href="/">Home</a>
    <a href="/prices">Prices</a>
    <a href="/book">Book</a>
    <a href="/contact" aria-current="page">Contact</a>
  </nav>

  <main>
    <section class="card">
      <h1 class="section-title">Get in touch</h1>
      <div class="contact">
        <a id="whatsapp-link" class="contact-item" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5.1 5.1 0 0 0 1 2.7 11.6 11.6 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>
          </span>
          <span>WhatsApp Della's on<br><strong id="whatsapp-number"></strong></span>
        </a>
        <a id="facebook-link" class="contact-item" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 22v-8h2.7l.4-3.2h-3.1V8.8c0-.9.3-1.5 1.6-1.5h1.7V4.4a22 22 0 0 0-2.5-.1c-2.4 0-4.1 1.5-4.1 4.2v2.3H7.5V14h2.7v8h3.3Z"/></svg>
          </span>
          <span>or DM on Facebook<br><strong id="facebook-name"></strong></span>
        </a>
      </div>
      <p class="address" id="address" hidden></p>
    </section>
    <section class="card">
      <h2 class="section-title">Working Days</h2>
      <ul class="hours-list" data-hours></ul>
    </section>
    <section class="card">
      <h2 class="section-title">Good to know</h2>
      <ul class="policies" id="policies"></ul>
    </section>
  </main>

  <footer class="footer">
    <div class="divider small"><span>♥</span></div>
    <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
  </footer>

  <script src="site.js"></script>
</body>
</html>
